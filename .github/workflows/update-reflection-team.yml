name: Update reflection to team voice

on:
  push:
    paths:
      - '.github/workflows/update-reflection-team.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update team wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('reflection/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('что я поняла', 'что мы поняли')
          s = s.replace('Что забираю с собой.', 'Что забираем с собой.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reflection/index.html
          git diff --cached --quiet || git commit -m "Use team voice in reflection site"
          git push
