<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Шутка!</title>
<style>
:root{--paper:#f7f4ec;--ink:#202020;--yellow:#f8eca0;--blue:#dceef9;--orange:#f3a51f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(#7b7468 .5px,transparent .5px);background-size:8px 8px}.card{width:min(920px,calc(100% - 28px));min-height:620px;border:3px solid var(--ink);border-radius:36px;background:var(--blue);position:relative;overflow:hidden;box-shadow:12px 12px 0 var(--ink);display:flex;align-items:center;padding:48px}.copy{position:relative;z-index:2;max-width:52%}.badge{display:inline-block;background:var(--yellow);border:2px solid var(--ink);padding:9px 14px;font-weight:950;transform:rotate(-2deg);box-shadow:4px 4px 0 var(--ink)}h1{font-family:"Comic Sans MS","Marker Felt",cursive;font-size:clamp(72px,12vw,150px);line-height:.85;letter-spacing:-.06em;margin:30px 0 18px}p{font-size:22px;line-height:1.45;margin:0 0 28px}.back{display:inline-block;text-decoration:none;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:13px 18px;font-weight:900;box-shadow:4px 4px 0 var(--ink)}.sergey{position:absolute;right:-10px;bottom:-8px;height:94%;filter:drop-shadow(0 18px 16px rgba(0,0,0,.13))}.heart{position:absolute;right:40px;top:28px;font-size:72px;transform:rotate(12deg)}@media(max-width:720px){.card{min-height:760px;align-items:flex-start;padding:30px}.copy{max-width:100%}h1{font-size:84px}.sergey{height:52%;right:-30px}.heart{font-size:48px}.copy p{max-width:75%}}
</style>
</head>
<body>
<main class="card">
  <div class="copy">
    <span class="badge">СЕРЁГА МОЛОДЕЦ</span>
    <h1>ШУТКА!</h1>
    <p>Никакого доната. Только уважение к Серёге и хорошему чувству юмора.</p>
    <a class="back" href="./">← Вернуться к рефлексии</a>
  </div>
  <div class="heart">♥</div>
  <svg class="sergey" viewBox="0 0 260 360" role="img" aria-label="Мультяшный Серёга"><g stroke="#222" stroke-width="4" stroke-linejoin="round"><path d="M65 335 L50 205 Q55 170 95 165 L165 165 Q205 170 210 205 L198 335 Z" fill="#f4efe4"/><path d="M98 164 L113 205 L147 205 L163 164" fill="#eadfce"/><ellipse cx="130" cy="105" rx="67" ry="82" fill="#e7b184"/><path d="M72 103 Q80 165 130 180 Q180 164 188 102 Q176 147 130 151 Q84 147 72 103Z" fill="#77452d"/><path d="M79 63 Q95 20 130 18 Q168 20 182 64 Q161 42 131 40 Q100 41 79 63Z" fill="#d7a476"/><path d="M72 96 Q75 30 130 22 Q185 30 188 96" fill="none"/><ellipse cx="105" cy="99" rx="7" ry="8" fill="#eaf4f3"/><ellipse cx="155" cy="99" rx="7" ry="8" fill="#eaf4f3"/><circle cx="106" cy="100" r="3" fill="#2a514b" stroke="none"/><circle cx="154" cy="100" r="3" fill="#2a514b" stroke="none"/><path d="M112 134 Q130 145 148 134" fill="none"/><path d="M92 83 Q103 77 114 82 M146 82 Q157 77 168 83" fill="none"/><path d="M205 220 Q240 205 242 240 Q235 270 207 267" fill="#f4efe4"/><path d="M240 238 l16 -7 l-8 15" fill="#f8eca0"/></g></svg>
</main>
</body>
</html>
